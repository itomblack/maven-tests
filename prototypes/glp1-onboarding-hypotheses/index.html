<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maven — GLP-1 Onboarding Hypotheses</title>
    <link rel="stylesheet" href="../../design-system/tokens.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: var(--space-0);
        padding: var(--space-0);
      }

      body {
        min-height: 100vh;
        background: var(--color-surface-secondary);
        color: var(--color-text-primary);
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      a {
        color: var(--color-text-link-primary);
      }

      h1,
      h2,
      h3,
      h4,
      p {
        margin: var(--space-0);
      }

      .page {
        min-height: 100vh;
        display: grid;
        align-content: start;
      }

      .page-header {
        background: var(--color-surface-primary);
        border-bottom: 1px solid var(--color-border-disabled);
      }

      .header-inner,
      .workspace {
        width: min(100%, 126ch);
        margin: var(--space-0) auto;
        padding: var(--space-16);
      }

      .header-inner {
        display: grid;
        gap: var(--space-12);
      }

      .breadcrumb {
        width: fit-content;
        text-decoration: none;
      }

      .heading-stack,
      .stack,
      .screen-stack,
      .detail-stack {
        display: grid;
        gap: var(--space-12);
      }

      .heading-stack {
        gap: var(--space-4);
      }

      .muted {
        color: var(--color-text-secondary);
      }

      .workspace {
        display: grid;
        gap: var(--space-16);
      }

      .hypothesis-switcher {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--space-4);
        padding: var(--space-4);
        border-radius: var(--radius-md);
        background: var(--color-coconut-100);
      }

      .hypothesis-button {
        min-width: var(--space-0);
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--color-text-secondary);
        padding: var(--space-8);
      }

      .hypothesis-button[aria-pressed="true"] {
        background: var(--color-surface-primary);
        border-color: var(--color-border-brand);
        color: var(--color-maven-800);
      }

      .comparison-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--space-8);
      }

      .comparison-item,
      .hypothesis-card,
      .flow-card {
        background: var(--color-surface-primary);
        border: 1px solid var(--color-border-disabled);
        border-radius: var(--radius-md);
        padding: var(--space-12);
      }

      .comparison-item {
        display: grid;
        gap: var(--space-4);
      }

      .prototype-grid {
        display: grid;
        gap: var(--space-16);
        justify-items: center;
      }

      .phone-column {
        width: min(100%, 25rem);
        display: grid;
        gap: var(--space-12);
      }

      .phone {
        width: 100%;
        background: var(--color-neutral-60);
        border-radius: var(--radius-lg);
        padding: var(--space-12);
        box-shadow: var(--elevation-overlay);
      }

      .phone-screen {
        min-height: 48rem;
        background: var(--color-surface-primary);
        border-radius: var(--radius-md);
        overflow: hidden;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
      }

      .status-bar {
        min-height: 2.5rem;
        padding: var(--space-8) var(--space-16);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-8);
      }

      .status-icons {
        display: flex;
        gap: var(--space-4);
      }

      .status-dot {
        width: var(--space-8);
        height: var(--space-8);
        border-radius: var(--radius-full);
        background: var(--color-icon-primary);
      }

      .mobile-nav {
        padding: var(--space-8) var(--space-16) var(--space-12);
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--space-8);
        border-bottom: 1px solid var(--color-border-disabled);
      }

      .wordmark {
        font-family: var(--font-family-emphasis);
        text-align: center;
        letter-spacing: var(--font-tracking-ivar);
      }

      .icon-button {
        width: var(--space-24);
        height: var(--space-24);
        border: var(--space-0);
        background: transparent;
        color: var(--color-icon-primary);
        padding: var(--space-0);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .screen-progress {
        height: var(--space-4);
        background: var(--color-gray-300);
      }

      .screen-progress span {
        display: block;
        height: 100%;
        background: var(--color-maven-500);
        transition: width 180ms ease;
      }

      .screen-content {
        padding: var(--space-20) var(--space-16);
        display: grid;
        align-content: start;
        gap: var(--space-16);
        overflow-y: auto;
      }

      .screen-footer {
        padding: var(--space-12) var(--space-16) var(--space-16);
        border-top: 1px solid var(--color-border-disabled);
        background: var(--color-surface-primary);
        display: grid;
        gap: var(--space-8);
      }

      .primary-button,
      .secondary-button,
      .text-button,
      .choice,
      .step-chip {
        border-radius: var(--radius-full);
        font-family: var(--font-family-primary);
      }

      .primary-button,
      .secondary-button {
        width: 100%;
        padding: var(--space-12) var(--space-16);
      }

      .primary-button {
        border: 1px solid var(--color-border-brand);
        background: var(--color-fill-button-primary);
        color: var(--color-text-primary-inverse);
      }

      .secondary-button {
        border: 1px solid var(--color-border-primary);
        background: var(--color-surface-primary);
        color: var(--color-text-button-secondary);
      }

      .text-button {
        border: var(--space-0);
        background: transparent;
        color: var(--color-text-link-primary);
        padding: var(--space-4);
      }

      .eyebrow-row,
      .chip-row,
      .metric-row,
      .byline,
      .check-row,
      .step-heading {
        display: flex;
        align-items: center;
        gap: var(--space-8);
      }

      .eyebrow-row,
      .metric-row,
      .step-heading {
        justify-content: space-between;
      }

      .chip-row {
        flex-wrap: wrap;
      }

      .chip,
      .step-chip {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        padding: var(--space-4) var(--space-8);
        background: var(--color-coconut-100);
        color: var(--color-text-secondary);
      }

      .chip.brand,
      .step-chip.active {
        background: var(--color-maven-100);
        color: var(--color-maven-800);
      }

      .chip.success {
        background: var(--color-fill-success-secondary);
        color: var(--color-icon-success);
      }

      .choice-list,
      .benefit-list,
      .proof-list,
      .flow-list {
        display: grid;
        gap: var(--space-8);
      }

      .choice {
        width: 100%;
        text-align: left;
        border: 1px solid var(--color-border-primary);
        background: var(--color-surface-primary);
        color: var(--color-text-primary);
        padding: var(--space-12) var(--space-16);
      }

      .choice.selected {
        border-color: var(--color-border-brand);
        background: var(--color-maven-25);
      }

      .field-grid {
        display: grid;
        gap: var(--space-12);
      }

      .field {
        display: grid;
        gap: var(--space-4);
      }

      .field input {
        width: 100%;
        border: 1px solid var(--color-border-primary);
        border-radius: var(--radius-sm);
        background: var(--color-surface-primary);
        color: var(--color-text-primary);
        padding: var(--space-12);
      }

      .card,
      .proof-card,
      .benefit-card,
      .forecast-card,
      .account-card,
      .reveal-card {
        border: 1px solid var(--color-border-disabled);
        border-radius: var(--radius-md);
        background: var(--color-surface-primary);
        padding: var(--space-16);
        display: grid;
        gap: var(--space-12);
      }

      .hero-card,
      .forecast-card,
      .reveal-card {
        background: var(--color-maven-25);
        border-color: var(--color-border-brand);
      }

      .hero-card {
        border: 1px solid var(--color-border-brand);
        border-radius: var(--radius-md);
        padding: var(--space-20);
        display: grid;
        gap: var(--space-16);
      }

      .portrait {
        width: 4rem;
        height: 4rem;
        flex: 0 0 auto;
        border-radius: var(--radius-full);
        border: 1px solid var(--color-border-disabled);
        background:
          linear-gradient(var(--color-surface-overlay-light), var(--color-surface-overlay-light)),
          var(--color-maven-300);
      }

      .avatar-small {
        width: var(--space-24);
        height: var(--space-24);
        flex: 0 0 auto;
        border-radius: var(--radius-full);
        background: var(--color-lychee-200);
      }

      .quote-mark {
        font-family: var(--font-family-emphasis);
        color: var(--color-maven-800);
      }

      .benefit-card {
        grid-template-columns: auto minmax(0, 1fr);
        align-items: start;
      }

      .benefit-icon,
      .check-icon {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-full);
        color: var(--color-icon-maven);
        background: var(--color-maven-100);
      }

      .benefit-icon {
        width: 2.5rem;
        height: 2.5rem;
      }

      .check-icon {
        width: var(--space-20);
        height: var(--space-20);
      }

      .forecast-heading {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: var(--space-12);
        align-items: start;
      }

      .forecast-number {
        color: var(--color-maven-800);
      }

      .chart {
        width: 100%;
        aspect-ratio: 16 / 9;
        display: block;
        overflow: visible;
      }

      .chart-grid {
        stroke: var(--color-border-disabled);
        stroke-width: 1;
      }

      .chart-area {
        fill: var(--color-maven-100);
      }

      .chart-line {
        fill: none;
        stroke: var(--color-maven-600);
        stroke-width: 5;
        stroke-linecap: round;
      }

      .chart-dot {
        fill: var(--color-maven-800);
        stroke: var(--color-surface-primary);
        stroke-width: 4;
      }

      .month-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: var(--space-4);
        color: var(--color-text-secondary);
        text-align: center;
      }

      .teaser-chart {
        position: relative;
        overflow: hidden;
      }

      .teaser-chart .chart-wrap {
        opacity: 0.35;
        filter: var(--background-blur);
      }

      .teaser-lock {
        position: absolute;
        inset: var(--space-0);
        display: grid;
        place-items: center;
        text-align: center;
        padding: var(--space-20);
        background: var(--color-surface-overlay-light);
      }

      .teaser-lock-inner {
        display: grid;
        gap: var(--space-8);
        justify-items: center;
      }

      .lock-icon {
        width: 3rem;
        height: 3rem;
        border-radius: var(--radius-full);
        display: grid;
        place-items: center;
        background: var(--color-fill-button-primary);
        color: var(--color-icon-primary-inverse);
      }

      .account-card {
        background: var(--color-coconut-100);
      }

      .account-benefits {
        display: grid;
        gap: var(--space-8);
      }

      .clinical-gate {
        border-left: var(--space-4) solid var(--color-maven-500);
        padding-left: var(--space-12);
        display: grid;
        gap: var(--space-4);
      }

      .step-rail {
        width: min(100%, 25rem);
        display: flex;
        gap: var(--space-8);
        overflow-x: auto;
        scrollbar-width: none;
      }

      .step-rail::-webkit-scrollbar {
        display: none;
      }

      .step-chip {
        flex: 0 0 auto;
        border: 1px solid var(--color-border-disabled);
        cursor: pointer;
      }

      .step-chip.active {
        border-color: var(--color-border-brand);
      }

      .detail-column {
        width: min(100%, 31rem);
        display: grid;
        gap: var(--space-12);
      }

      .hypothesis-card {
        display: grid;
        gap: var(--space-8);
      }

      .flow-card {
        display: grid;
        gap: var(--space-12);
      }

      .flow-item {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: var(--space-8);
        align-items: start;
      }

      .flow-number {
        width: var(--space-24);
        height: var(--space-24);
        border-radius: var(--radius-full);
        display: grid;
        place-items: center;
        background: var(--color-coconut-100);
        color: var(--color-text-secondary);
      }

      .flow-item.active .flow-number {
        background: var(--color-maven-100);
        color: var(--color-maven-800);
      }

      @media (max-width: 42rem) {
        .hypothesis-switcher,
        .comparison-strip {
          grid-template-columns: 1fr;
        }

        .hypothesis-switcher {
          gap: var(--space-4);
        }
      }

      @media (min-width: 58rem) {
        .header-inner {
          padding: var(--space-20) var(--space-24);
          grid-template-columns: minmax(0, 1fr) auto;
          align-items: end;
        }

        .workspace {
          padding: var(--space-24);
        }

        .prototype-grid {
          grid-template-columns: minmax(25rem, 1fr) minmax(20rem, 31rem);
          align-items: start;
          justify-items: center;
        }

        .detail-column {
          width: 100%;
          position: sticky;
          top: var(--space-24);
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div class="header-inner">
          <div class="heading-stack">
            <a class="breadcrumb ds-interactive-small" href="../../">← All prototypes</a>
            <h1 class="ds-headline-emphasis-lg">GLP-1 onboarding hypotheses</h1>
            <p class="ds-body-small muted">Three mobile-first paths from interest to account creation, each testing a different conversion idea.</p>
          </div>
          <div class="chip-row">
            <span class="chip brand ds-overline">Mobile first</span>
            <span class="chip ds-body-supportive">Interactive flow</span>
          </div>
        </div>
      </header>

      <section class="workspace">
        <div class="hypothesis-switcher" id="hypothesisSwitcher" aria-label="Choose a hypothesis"></div>
        <div class="comparison-strip" id="comparisonStrip"></div>

        <div class="prototype-grid">
          <div class="phone-column">
            <div class="phone">
              <div class="phone-screen">
                <div class="status-bar">
                  <span class="ds-body-supportive">9:41</span>
                  <div class="status-icons" aria-hidden="true">
                    <span class="status-dot"></span>
                    <span class="status-dot"></span>
                    <span class="status-dot"></span>
                  </div>
                </div>
                <div>
                  <div class="mobile-nav">
                    <button class="icon-button ds-subheadline-xs" id="backButton" type="button" aria-label="Previous screen">‹</button>
                    <div class="wordmark ds-headline-emphasis-xs">Maven</div>
                    <span class="ds-body-supportive muted" id="stepCounter"></span>
                  </div>
                  <div class="screen-progress"><span id="progressBar"></span></div>
                </div>
                <section class="screen-content" id="screenContent" aria-live="polite"></section>
                <footer class="screen-footer" id="screenFooter"></footer>
              </div>
            </div>
            <nav class="step-rail" id="stepRail" aria-label="Flow screens"></nav>
          </div>

          <aside class="detail-column">
            <article class="hypothesis-card" id="hypothesisCard"></article>
            <article class="flow-card">
              <div class="step-heading">
                <h2 class="ds-subheadline-xs">Flow structure</h2>
                <span class="chip ds-body-supportive" id="screenCount"></span>
              </div>
              <div class="flow-list" id="flowList"></div>
            </article>
          </aside>
        </div>
      </section>
    </main>

    <script>
      const hypotheses = [
        {
          id: "simplify",
          short: "1. Simplify",
          name: "Simplify before signup",
          hypothesis: "Reducing pre-signup effort to goals, body basics, and a useful forecast will increase account creation without needing persuasion screens.",
          proofTiming: "After signup",
          forecastTiming: "Before signup",
          preSignup: "4 screens",
          steps: [
            { id: "intent", label: "Goal", title: "What would you like support with?", cta: "Continue" },
            { id: "body", label: "Body basics", title: "Let's shape your forecast", cta: "Build my forecast" },
            { id: "forecast", label: "Forecast", title: "Your 12-month direction", cta: "Save my forecast" },
            { id: "account-simple", label: "Create account", title: "Keep your progress", cta: "Create account" },
            { id: "clinical", label: "Clinical review", title: "Now let's make it medically right for you", cta: "Start health questions" },
          ],
        },
        {
          id: "proof",
          short: "2. Proof + value",
          name: "Earn signup with proof and value",
          hypothesis: "Specific outcome evidence, a clearer Maven care model, and a compelling 12-month forecast will build enough trust to make account creation feel worthwhile.",
          proofTiming: "Before signup",
          forecastTiming: "Before signup",
          preSignup: "5 screens",
          steps: [
            { id: "proof-hero", label: "Outcome proof", title: "A year can change more than the number", cta: "See how Maven helps" },
            { id: "program", label: "Maven value", title: "Medication is one part of your care", cta: "Build my plan" },
            { id: "body-rich", label: "Body basics", title: "Let's personalize your 12-month view", cta: "Show my forecast" },
            { id: "forecast-rich", label: "12-month forecast", title: "Picture where a year could take you", cta: "Save this plan" },
            { id: "account-value", label: "Create account", title: "Your plan is ready to become care", cta: "Create my Maven account" },
            { id: "clinical", label: "Clinical review", title: "Next, your provider checks what is safe", cta: "Start health questions" },
          ],
        },
        {
          id: "teaser",
          short: "3. Teaser reward",
          name: "Use the forecast as the reward",
          hypothesis: "Showing strong proof first, then withholding the completed personalized forecast until after signup, will create a motivating and credible reward for account creation.",
          proofTiming: "Before signup",
          forecastTiming: "After signup",
          preSignup: "5 screens",
          steps: [
            { id: "proof-hero", label: "Outcome proof", title: "A year can change more than the number", cta: "See how Maven helps" },
            { id: "program", label: "Maven value", title: "Medication is one part of your care", cta: "Build my plan" },
            { id: "body-rich", label: "Body basics", title: "Let's personalize your 12-month view", cta: "Create my forecast" },
            { id: "forecast-teaser", label: "Forecast ready", title: "Your 12-month forecast is ready", cta: "Unlock my forecast" },
            { id: "account-teaser", label: "Create account", title: "Unlock your personalized result", cta: "Create account and reveal" },
            { id: "forecast-reveal", label: "Reward reveal", title: "Here is your 12-month direction", cta: "Continue to clinical review" },
            { id: "clinical", label: "Clinical review", title: "Now let's make it medically right for you", cta: "Start health questions" },
          ],
        },
      ];

      let activeHypothesisId = "simplify";
      let activeStep = 0;

      const hypothesisSwitcher = document.getElementById("hypothesisSwitcher");
      const comparisonStrip = document.getElementById("comparisonStrip");
      const screenContent = document.getElementById("screenContent");
      const screenFooter = document.getElementById("screenFooter");
      const stepCounter = document.getElementById("stepCounter");
      const progressBar = document.getElementById("progressBar");
      const backButton = document.getElementById("backButton");
      const stepRail = document.getElementById("stepRail");
      const hypothesisCard = document.getElementById("hypothesisCard");
      const flowList = document.getElementById("flowList");
      const screenCount = document.getElementById("screenCount");

      function activeHypothesis() {
        return hypotheses.find((item) => item.id === activeHypothesisId) || hypotheses[0];
      }

      function render() {
        const hypothesis = activeHypothesis();
        const step = hypothesis.steps[activeStep];

        hypothesisSwitcher.innerHTML = hypotheses.map((item) => `
          <button class="hypothesis-button ds-interactive-small" type="button" data-hypothesis="${item.id}" aria-pressed="${item.id === activeHypothesisId}">
            ${item.short}
          </button>
        `).join("");

        comparisonStrip.innerHTML = `
          <div class="comparison-item"><span class="ds-overline muted">Proof timing</span><strong class="ds-body-small">${hypothesis.proofTiming}</strong></div>
          <div class="comparison-item"><span class="ds-overline muted">Forecast timing</span><strong class="ds-body-small">${hypothesis.forecastTiming}</strong></div>
          <div class="comparison-item"><span class="ds-overline muted">Before signup</span><strong class="ds-body-small">${hypothesis.preSignup}</strong></div>
        `;

        stepCounter.textContent = `${activeStep + 1} / ${hypothesis.steps.length}`;
        progressBar.style.width = `${((activeStep + 1) / hypothesis.steps.length) * 100}%`;
        backButton.style.visibility = activeStep === 0 ? "hidden" : "visible";
        screenContent.innerHTML = screenFor(step.id, step.title);
        screenFooter.innerHTML = `
          <button class="primary-button ds-interactive-default" id="nextButton" type="button">${step.cta}</button>
          ${activeStep < hypothesis.steps.length - 1 ? `<p class="ds-body-supportive muted" style="text-align:center">No payment today</p>` : ""}
        `;

        stepRail.innerHTML = hypothesis.steps.map((item, index) => `
          <button class="step-chip ds-body-supportive ${index === activeStep ? "active" : ""}" type="button" data-step="${index}">
            ${index + 1}. ${item.label}
          </button>
        `).join("");

        hypothesisCard.innerHTML = `
          <span class="chip brand ds-overline">${hypothesis.short}</span>
          <h2 class="ds-headline-emphasis-sm">${hypothesis.name}</h2>
          <p class="ds-body-small muted">${hypothesis.hypothesis}</p>
        `;

        screenCount.textContent = `${hypothesis.steps.length} screens`;
        flowList.innerHTML = hypothesis.steps.map((item, index) => `
          <button class="text-button flow-item ${index === activeStep ? "active" : ""}" type="button" data-step="${index}">
            <span class="flow-number ds-body-supportive">${index + 1}</span>
            <span style="text-align:left"><strong class="ds-body-small">${item.label}</strong><br><span class="ds-body-supportive muted">${item.title}</span></span>
          </button>
        `).join("");

        hypothesisSwitcher.querySelectorAll("[data-hypothesis]").forEach((button) => {
          button.addEventListener("click", () => {
            activeHypothesisId = button.dataset.hypothesis;
            activeStep = 0;
            render();
          });
        });

        document.querySelectorAll("[data-step]").forEach((button) => {
          button.addEventListener("click", () => {
            activeStep = Number(button.dataset.step);
            render();
          });
        });

        document.getElementById("nextButton").addEventListener("click", () => {
          if (activeStep < hypothesis.steps.length - 1) {
            activeStep += 1;
            render();
          }
        });
      }

      backButton.addEventListener("click", () => {
        if (activeStep > 0) {
          activeStep -= 1;
          render();
        }
      });

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design QA comparison</title>
    <link rel="stylesheet" href="../../design-system/tokens.css" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: var(--space-16); background: var(--color-surface-primary); font-family: var(--font-family-primary); }
      main { display: flex; gap: var(--space-16); align-items: flex-start; }
      figure { margin: 0; width: 390px; }
      figcaption { height: calc(var(--space-24) + var(--space-4)); color: var(--color-text-primary); font-size: var(--font-size-body-sm); font-weight: var(--font-weight-bold); }
      .frame { width: 390px; height: 844px; overflow: hidden; background: var(--color-surface-secondary); }
      .source { display: block; width: 390px; height: 844px; object-fit: cover; }
      .implementation { display: block; width: 1280px; height: 1000px; transform: translate(-223px, -149px); transform-origin: top left; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Source Maven mobile language</figcaption>
        <div class="frame"><img class="source" src="./source-maven-mobile.png" alt="Source Maven mobile screen" /></div>
      </figure>
      <figure>
        <figcaption>Implemented current-design phone</figcaption>
        <div class="frame"><img class="implementation" src="./implementation-current.png" alt="Implemented phone preview" /></div>
      </figure>
    </main>
  </body>
</html>
